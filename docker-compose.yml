services:

  backend:
    build: ./app
    ports:
      - "8000:8000"
    env_file:
      - ./app/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://shivanshi:shivanshi@db:5432/instagram
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shivanshi
      POSTGRES_PASSWORD: shivanshi
      POSTGRES_DB: instagram
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivanshi -d instagram"]
      interval: 5s
      timeout: 5s
      retries: 10
